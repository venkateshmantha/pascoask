[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pascoask"
version = "0.1.0"
description = "Natural language agent over Pasco County, FL public government records"
requires-python = ">=3.11"
dependencies = [
    # Scraping & HTTP
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # PDF extraction
    "pdfplumber>=0.11",
    # Storage
    "sqlite-utils>=3.37",
    # Embeddings & Vector DB
    "openai>=1.30",
    "qdrant-client>=1.9",
    # LLM (Anthropic)
    "anthropic>=0.40",
    # Re-ranking
    "sentence-transformers>=3.0",
    # Evaluation
    "ragas>=0.1",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # MCP
    "mcp>=1.0",
    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rich>=13.7",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
